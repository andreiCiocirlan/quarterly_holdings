services:
  postgres:
    image: postgres:latest
    container_name: quarterly_holdings-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filings_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quarterly_holdings-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "15432:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  python-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarterly_holdings-python-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: filings_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - .:/app
    working_dir: /app
    command: python run.py
    ports:
      - "5000:5000"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:

networks:
  app-network:
    name: quarterly_holdings_network
    driver: bridge
